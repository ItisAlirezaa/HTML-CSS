  <!-- Signup Form -->
    <div class="signup-form">
        <h2>ورود</h2>
        <form>
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="email">ایمیل</label>
                <textarea class="textarea"></textarea>
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" required>
            </div>
             <div class="form-group">
                <label>آیا ورود ذخیره شود؟</label>
                 
                <input type="radio" name="accountType" id="yes" required>بله <br>
               
                <input type="radio" name="accountType" id="no">خیر<br>
               
            </div>
            <div class="form-group">
                <input type="checkbox" id="newsletter">اشتراک در خبرنامه<br>
              
            </div>
            <div class="form-group">
                <input type="checkbox" id="terms" required>قوانین و مقررات را می‌پذیرم<br>
                
            </div>
            <div class="form-group">
                <button type="submit">ورود</button>
            </div>

        </form>
    </div>

    <!-- Footer -->
    <footer>
    <div class="footer">
        <div class="logo">
            <img src="aks/logo.png" alt="لوگوی فروشگاه"class="footer-icon-img">
        </div>
        <div class="address">
            <p>آدرس فروشگاه: خیابان ولیعصر، پاساژ رضا،طبقه همکف ، شماره 45</p>
        </div>
        <div class="social-icon-img">
            <a href="https://www.instagram.com" target="_blank">
                <img src="aks/instagram-icon.png" alt="اینستاگرام" class="footer-icon-img">
            </a>
            <a href="https://www.facebook.com" target="_blank">
                <img src="aks/facebook-icon.png" alt="فیسبوک"class="footer-icon-img">
            </a>
            <a href="https://www.twitter.com" target="_blank">
                <img src="aks/twitter-icon.png" alt="توئیتر"class="footer-icon-img">
            </a>
            <a href="https://www.linkedin.com" target="_blank">
                <img src="aks/linkedin-icon.png" alt="لینکدین"class="footer-icon-img">
            </a>
        </div>
    </div>
</footer>
