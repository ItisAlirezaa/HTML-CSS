<!DOCTYPE html>
<html>
<head>
	<title>Register</title>
</head>
<body>
	<form method="GET">
		First Name : <input type="text" name="fname"><br>
		Last Name  : <input type="text" name="lname"><br>
		Email      : <input type="Email" name="email" required><br>
		Password   : <input type="Password" name="pass" minlength="5"><br>
		Birthday   : <input type="date" name="bday" required><br>
		Gender : <br>
		<input type="radio" name="Gender" value="Male">Male<br>
		<input type="radio" name="Gender" value="Female">Female<br>
		Pets   : <br>
		<input type="checkbox" name="cat">cats<br>
		<input type="checkbox" name="dog">dogs<br>
		Cars   : <br>
		<select name="car">
			<option value="Toyota" name="Toyota">Toyota</option>
			<option value="Nisan" name="Nisan">Nisan</option>
			<option value="Pride" name="Pride">Pride</option>
		</select><br>
		<input type="submit" name="" value="Register">
		<input type="reset" name="">


	</form>

</body>
</html>
